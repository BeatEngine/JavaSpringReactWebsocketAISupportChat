services:
  aimodell:
    #image: ollama/ollama # only cpu alpine/ollama (GPU ollama/ollama)
    build:
      context: ./LLMServer
      dockerfile: Dockerfile.LLMserver
    deploy: # When using ollama/ollama for NVIDIA GPU otherwise comment out!
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: always
    ports:
      - "11434:11434"
    env_file: "environmentconfigurations.env"

# Use postgres/example user/password credentials
  db:
    #image: postgres
    build:
      context: ./DBServer
      dockerfile: Dockerfile.DBserver
    restart: always
    ports:
      - 5432:5432
    # Definition of POSTGRES_PASSWORD POSTGRES_START_DB
    env_file: "environmentconfigurations.env"

    # set shared memory limit when using docker compose
    shm_size: 128mb

  ### The whole application SPA Java Spring MVC + AI tool-calling module and React frontend
  application:
    # The application itself loads the environmentconfigurations.env copied into the container at build.
    restart: always
    depends_on:
      db:
        condition: service_healthy # Wait for DB is ready pg_ready
      aimodell:
        condition: service_healthy # Wait for LLM OLLAMA_MODEL is pulled
    ports:
      - 8080:8080 #Only as demo without TLS certs.
    build:
      context: .
      dockerfile: Dockerfile

#volumes:
  #db-data:
    #driver: flocker
    #driver_opts:
      #size: "10GiB"

secrets:
  server-certificate:
    external: true
